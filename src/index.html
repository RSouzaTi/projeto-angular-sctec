<!doctype html>
<!--
  index.html - a ÚNICA página HTML do projeto (por isso Angular é uma SPA: Single Page Application).
  O navegador abre este arquivo e o Angular "desenha" toda a aplicação dentro de <app-root>.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Projeto Angular SCTEC</title>
  <!-- base href="/": ponto de partida das rotas (/contato, /cadastro...) -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <!-- <app-root> é o seletor do componente raiz (src/app/app.ts). Tudo aparece aqui dentro. -->
  <app-root></app-root>
</body>
</html>
